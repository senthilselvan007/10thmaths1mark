:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#667085;--line:#dfe3ec;--accent:#4f46e5;--ok:#16794c;--okbg:#e3f6ec;--bad:#b42318;--badbg:#fdeaea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1e2a;--text:#eceef6;--muted:#9aa1b5;--line:#2c3144;--accent:#8b8cf8;--ok:#5dd39e;--okbg:#14382a;--bad:#ff8a80;--badbg:#411c1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1b1e2a;--text:#eceef6;--muted:#9aa1b5;--line:#2c3144;--accent:#8b8cf8;--ok:#5dd39e;--okbg:#14382a;--bad:#ff8a80;--badbg:#411c1c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:1rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Tamil","Latha",sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1{font-size:1.3rem;margin:0}
h2{font-size:1rem;margin:20px 0 8px}
.sub{color:var(--muted);font-size:.9rem}
.seg{display:inline-flex;border:1.5px solid var(--accent);border-radius:10px;overflow:hidden}
.seg button{background:transparent;color:var(--accent);border:0;padding:7px 14px;font:600 .9rem system-ui,"Noto Sans Tamil","Latha",sans-serif;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.row:hover{border-color:var(--accent)}
.row input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.row .n{margin-left:auto;color:var(--muted);font-size:.85rem;white-space:nowrap}
.links{display:flex;gap:16px;margin:0 0 8px}
.link{background:none;border:0;color:var(--accent);font:600 .9rem system-ui,"Noto Sans Tamil","Latha",sans-serif;cursor:pointer;padding:0}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 20px;font:600 1rem system-ui,"Noto Sans Tamil","Latha",sans-serif;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.alt{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.go{margin-top:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:12px}
.tag{color:var(--muted);font-size:.85rem;margin:0 0 6px}
.q{font-size:1.1rem;font-weight:600;margin:0 0 16px;font-family:Georgia,"Times New Roman","Noto Sans Tamil","Latha",serif;line-height:1.9}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--text);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;font:inherit;font-family:Georgia,"Times New Roman","Noto Sans Tamil","Latha",serif;cursor:pointer;overflow-x:auto}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt b{flex:none;min-width:26px;height:26px;border-radius:13px;background:var(--line);display:grid;place-items:center;font:600 .85rem system-ui,"Noto Sans Tamil","Latha",sans-serif;padding:0 6px}
.opt span{white-space:nowrap}

.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 22px -8px var(--accent);filter:brightness(1.05)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn.alt{background:transparent;box-shadow:none;border-radius:14px}
.btn.alt:hover:not(:disabled){background:var(--ring)}
.chipbtn{transition:all .15s}.chipbtn:hover{transform:translateY(-1px);box-shadow:0 0 0 4px var(--ring)}
.chipbtn[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.cnum,.tin{border-radius:12px;transition:border-color .15s,box-shadow .15s}
.cnum:focus,.tin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--ring)}
.seg{border-radius:12px;padding:2px}.seg button{border-radius:9px;transition:background .15s}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.link{transition:opacity .15s}.link:hover{opacity:.7}
.hbtn{border-radius:20px;padding:26px 22px;box-shadow:var(--shadow);transition:transform .18s,border-color .18s,box-shadow .18s;position:relative;overflow:hidden}
.hbtn::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.hbtn:hover{transform:translateY(-4px);box-shadow:0 18px 36px -14px var(--accent)}
.hic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(99,102,241,.16),rgba(139,92,246,.16));font-size:1.7rem}
.secbar{padding:10px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.bar{height:10px;border-radius:10px;background:var(--line);box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.bar i{background:linear-gradient(90deg,var(--accent),var(--accent2),#ec4899);border-radius:10px;transition:width .45s cubic-bezier(.4,0,.2,1)}
.meta{font-weight:600}
.tag{display:inline-block;background:rgba(99,102,241,.1);color:var(--accent);padding:4px 12px;border-radius:999px;font-weight:600;font-size:.78rem}
.q{font-size:1.2rem;line-height:1.85;margin:14px 0 20px}
.fig{border-radius:14px;border:1px dashed var(--line);background:rgba(127,127,127,.06)}
.opt{border-radius:14px;padding:13px 16px;margin-bottom:12px;border-width:2px;box-shadow:0 1px 2px rgba(20,24,50,.05);transition:transform .15s,border-color .15s,box-shadow .15s,background .15s}
.opt:hover:not(:disabled){transform:translateX(4px);box-shadow:0 0 0 4px var(--ring)}
.opt b{width:32px;height:32px;min-width:32px;border-radius:10px;background:rgba(99,102,241,.12);color:var(--accent);transition:all .15s}
.opt.sel{background:linear-gradient(135deg,rgba(99,102,241,.13),rgba(139,92,246,.1));box-shadow:0 0 0 4px var(--ring)}
.opt.sel b{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.opt.ok{box-shadow:0 0 0 4px rgba(22,121,76,.18)}.opt.ok b{background:var(--ok);color:#fff}
.opt.bad{box-shadow:0 0 0 4px rgba(180,35,24,.15)}.opt.bad b{background:var(--bad);color:#fff}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}

.fb{padding:0;border-radius:12px}.fb.ok,.fb.bad{padding:10px 14px}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.flagbtn{transition:all .15s}.flagbtn:hover{border-color:var(--fl);color:var(--fl)}
.nav{padding-top:16px;border-top:1px solid var(--line)}
.pal{border-radius:18px;box-shadow:var(--shadow)}
.pq{border-radius:12px;transition:transform .12s,box-shadow .12s}.pq:hover{transform:translateY(-2px);box-shadow:0 0 0 3px var(--ring)}
.pq.a{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.stat{border-radius:16px;background:var(--card);box-shadow:var(--shadow);border-color:var(--line);padding:16px 8px}
.stat b{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.score{font-size:3.6rem;background:linear-gradient(135deg,var(--accent),var(--accent2),#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.cbrow{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.cbbar{height:12px}.cbbar i{transition:width .6s}
.rev{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:var(--card)}
.ans{border-radius:10px}
.rtag{background:linear-gradient(135deg,var(--fl),#f59e0b);color:#fff}
.rvbar h3{font-size:1.05rem}
@media (max-width:520px){.top{padding:12px}h1{font-size:1.1rem}.card{padding:18px 14px;border-radius:16px}.q{font-size:1.08rem}}

}

/* 2 pages per sheet: split into columns inside each part (set / OMR / answer key) instead of on the whole paper,

@media print{

}
